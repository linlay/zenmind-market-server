services:
  market-server:
    build:
      context: .
    image: zenmind-market-server
    container_name: zenmind-market-server
    environment:
      MARKET_ADDR: :8088
      MARKET_DB_PATH: /data/market.db
      MARKET_ARTIFACT_ROOT: /data/artifacts
      MARKET_PUBLIC_BASE_URL: ${MARKET_PUBLIC_BASE_URL:-https://market.zenmind.cc}
      MARKET_ADMIN_TOKEN: ${MARKET_ADMIN_TOKEN:-}
      MARKET_PROXY_TOKEN: ${MARKET_PROXY_TOKEN:-}
      SSO_JWT_ISSUER: ${SSO_JWT_ISSUER:-}
      SSO_JWT_PUBLIC_KEY_FILE: ${SSO_JWT_PUBLIC_KEY_FILE:-}
      SSO_JWT_PUBLIC_KEY_PEM: ${SSO_JWT_PUBLIC_KEY_PEM:-}
      SSO_JWT_AUDIENCE: ${SSO_JWT_AUDIENCE:-zenmind-market-server}
      MARKET_MAX_UPLOAD_BYTES: ${MARKET_MAX_UPLOAD_BYTES:-536870912}
    volumes:
      - ./data:/data
    networks:
      zenmind-official-net:
        aliases:
          - zenmind-market-server
    restart: unless-stopped

networks:
  zenmind-official-net:
    external: true
